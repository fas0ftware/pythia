[project]
name = "pythia-dns"
version = "0.2.0"
description = "A DNS filter for the whole home network: ads, trackers and malware domains"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pythia = "pythia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pythia"]

[tool.setuptools.package-data]
pythia = ["static/*"]
